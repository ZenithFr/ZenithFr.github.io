<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith OS - Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="md.css">
</head>
<body class="os-body">
    <nav class="navbar" id="navbar">
        <a href="../index.html" class="nav-logo magnetic" data-strength="20">
          <span>Z</span>ENITH
        </a>
    </nav>

    <div class="desktop-environment">
        <div class="window-explorer glass-card">
            <div class="window-header">
                <div class="window-controls">
                    <span class="control close"></span>
                    <span class="control minimize"></span>
                    <span class="control maximize"></span>
                </div>
                <div class="window-title">C:\Zenith\Documents\MD</div>
            </div>
            <div class="window-toolbar">
                <div class="toolbar-nav">
                    <button><i class="fa-solid fa-arrow-left"></i></button>
                    <button><i class="fa-solid fa-arrow-right"></i></button>
                    <button><i class="fa-solid fa-arrow-up"></i></button>
                </div>
                <div class="toolbar-address">
                    <i class="fa-regular fa-folder-open"></i> Zenith OS > Documents > MD
                </div>
                <div class="toolbar-search">
                    <i class="fa-solid fa-magnifying-glass"></i> Search Files
                </div>
            </div>
            <div class="window-body">
                <div class="sidebar">
                    <ul>
                        <li onclick="window.location.href='../index.html'"><i class="fa-solid fa-desktop"></i> Desktop</li>
                        <li><i class="fa-solid fa-download"></i> Downloads</li>
                        <li class="active"><i class="fa-solid fa-file-lines"></i> Documents</li>
                        <li><i class="fa-solid fa-image"></i> Pictures</li>
                    </ul>
                </div>
                <div class="main-content">
                    <a href="template-website/design.md" class="file-item">
                        <div class="file-icon">
                            <i class="fa-brands fa-markdown" style="font-size: 3rem; color: #4a90e2;"></i>
                        </div>
                        <div class="file-name">design.md</div>
                        <div class="file-meta">Markdown File</div>
                    </a>
                    <a href="template-website/index.html" class="file-item">
                        <div class="file-icon">
                            <i class="fa-brands fa-html5" style="font-size: 3rem; color: #e34f26;"></i>
                        </div>
                        <div class="file-name">index.html</div>
                        <div class="file-meta">HTML Document</div>
                    </a>
                    <a href="template-website/style.css" class="file-item">
                        <div class="file-icon">
                            <i class="fa-brands fa-css3-alt" style="font-size: 3rem; color: #264de4;"></i>
                        </div>
                        <div class="file-name">style.css</div>
                        <div class="file-meta">CSS Stylesheet</div>
                    </a>
                    <a href="template-website/assets/" class="file-item">
                        <div class="file-icon">
                            <i class="fa-solid fa-folder" style="font-size: 3rem; color: #e8b724;"></i>
                        </div>
                        <div class="file-name">assets</div>
                        <div class="file-meta">File Folder</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
